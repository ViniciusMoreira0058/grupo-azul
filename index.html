<meta name="description" content="Gestão de obras, orçamentos e financeiro do Grupo Azul Instalações Hidráulicas">

<meta property="og:description" content="Gestão de obras, orçamentos e financeiro">

<meta property="og:image:width" content="1200">

<style>
:root{--bp-tile:url("assets/blueprint-tile.webp");--bp-one:url("assets/blueprint.webp")}
/* Layout: app de bolso no padrão Bold — fundo preto, menu ☰ em gaveta (fixo à esquerda no desktop), cartões discretos, azul da gota como único destaque */
:root{
  --bg:#000000; --surface:#0d1117; --surface-2:#151b24; --line:#1f2733; --fg:#f2f5f9; --muted:#8a96a8;
  --accent:#3a7bd5; --accent-2:#5aaee6; --accent-ink:#ffffff; --accent-soft:rgba(90,174,230,.14);
  --good:#3ccf91; --good-soft:rgba(60,207,145,.14); --warn:#f0b43c; --warn-soft:rgba(240,180,60,.15); --bad:#ef5f5f; --bad-soft:rgba(239,95,95,.14);
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5);
  --show-dark:block; --show-light:none;
  --bp-line:#5aaee6; --bp-op:.17; --glass:rgba(10,14,20,.72); --brand-deep:#0a3f8c; --brand-deeper:#06275a;
  --f-display:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f7; --line:#dfe5ee; --fg:#0e1a2b; --muted:#5c6b80;
  --accent:#2f6cc4; --accent-2:#3a8fd0; --accent-soft:rgba(58,123,213,.10);
  --good:#178a5c; --good-soft:rgba(23,138,92,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.12); --bad:#c93a3a; --bad-soft:rgba(201,58,58,.10);
  --scrim:rgba(14,26,43,.4); --shadow:0 10px 40px rgba(14,26,43,.12);
  --show-dark:none; --show-light:block; color-scheme:light;
  --bp-line:#2f6cc4; --bp-op:.10; --glass:rgba(255,255,255,.8);
}}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#eef2f7; --line:#dfe5ee; --fg:#0e1a2b; --muted:#5c6b80;
  --accent:#2f6cc4; --accent-2:#3a8fd0; --accent-soft:rgba(58,123,213,.10);
  --good:#178a5c; --good-soft:rgba(23,138,92,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.12); --bad:#c93a3a; --bad-soft:rgba(201,58,58,.10);
  --scrim:rgba(14,26,43,.4); --shadow:0 10px 40px rgba(14,26,43,.12);
  --show-dark:none; --show-light:block; color-scheme:light;
  --bp-line:#2f6cc4; --bp-op:.10; --glass:rgba(255,255,255,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.logo-d{display:var(--show-dark)} .logo-l{display:var(--show-light)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- Desenho técnico (identidade) ---------- */
.bp-tile{-webkit-mask-image:var(--bp-tile);mask-image:var(--bp-tile);-webkit-mask-repeat:repeat;mask-repeat:repeat;background-color:var(--bp-line)}
.bp-one{-webkit-mask-image:var(--bp-one);mask-image:var(--bp-one);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:cover;mask-size:cover}
.bp-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bp-bg .bp-tile{position:absolute;inset:0;opacity:var(--bp-op);-webkit-mask-size:1500px auto;mask-size:1500px auto}
.bp-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 70% 0%,transparent 0%,var(--bg) 78%)}
#app>main,#app>.topbar{position:relative;z-index:1}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 24px;margin-bottom:16px;color:#ffffff;background:linear-gradient(120deg,var(--brand-deeper) 0%,var(--brand-deep) 55%,#1a62c4 100%);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;isolation:isolate}
.hero .lines{position:absolute;inset:0;z-index:-1;background-color:#ffffff;opacity:.38;-webkit-mask-position:right center;mask-position:right center}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--brand-deeper) 0%,rgba(6,39,90,.55) 45%,transparent 80%)}
.hero h1{font-size:30px;line-height:1.1}
.hero p{margin:6px 0 0;color:#cfe2fb}
.hero .eyebrow{color:#9cc6f5}
.hero .btn.primary{background:#ffffff;color:var(--brand-deep)}

/* ---------- Login ---------- */
#login{position:relative;overflow:hidden;isolation:isolate;min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;display:grid;gap:26px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow)}
.scene{position:absolute;inset:0;z-index:-1;perspective:700px;perspective-origin:50% 50%;overflow:hidden;background:radial-gradient(70% 50% at 50% 50%,var(--accent-soft),transparent 70%),var(--bg)}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s ease-out}
.plane{position:absolute;left:-60%;width:220%;height:130%;-webkit-mask-size:1200px auto;mask-size:1200px auto;animation:flow 26s linear infinite}
.plane.floor{top:50%;transform-origin:50% 0;transform:rotateX(78deg);opacity:calc(var(--bp-op)*6.5)}
.plane.ceil{bottom:50%;transform-origin:50% 100%;transform:rotateX(-78deg);opacity:calc(var(--bp-op)*4);animation-direction:reverse}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--bg),transparent 30%,transparent 70%,var(--bg)),radial-gradient(45% 14% at 50% 50%,var(--bg),transparent),radial-gradient(60% 6% at 50% 50%,var(--accent-soft),transparent)}
@keyframes flow{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:0 581px;mask-position:0 581px}}
@media (prefers-reduced-motion:reduce){.plane{animation:none}.rig{transition:none}}
.login-card .brand img{width:min(300px,100%);margin-inline:auto}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.input:focus{border-color:var(--accent-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%;padding:13px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.roles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.demo-note{font-size:12px;color:var(--muted);text-align:center}

/* ---------- Shell ---------- */
#app{min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .menu-btn{background:none;border:0;font-size:22px;line-height:1;padding:6px;margin-left:-6px;border-radius:8px}
.topbar img{height:30px;width:auto}
.topbar .spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);font-weight:700;font-size:13px;border:1px solid var(--line)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:272px;max-width:85vw;z-index:40;isolation:isolate;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.drawer.open{transform:none;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer .d-logo{padding:4px 8px 22px}
.drawer .d-logo img{width:190px}
.nav{display:grid;gap:2px}
.nav-label{padding:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{color:var(--fg);background:var(--surface-2)}
.nav button.active{color:var(--fg);background:var(--accent-soft)}
.nav button.active svg{stroke:var(--accent-2)}
.nav button[disabled]{cursor:default;opacity:.55}
.nav-sub{display:grid;gap:2px;margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid var(--line)}
.nav .nav-sub button{padding:7px 10px;font-size:13.5px;font-weight:500}
.nav .nav-sub button.on{color:var(--accent-2);background:none;font-weight:700}
.nav button[disabled]:hover{background:none;color:var(--muted)}
.soon{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.drawer .foot{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px 12px}
.user-row small{display:block;color:var(--muted);font-size:12px}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin-inline:auto}
@media (min-width:1000px){
  .drawer{transform:none;box-shadow:none}
  .scrim,.topbar .menu-btn,.topbar img{display:none!important}
  #app{padding-left:272px}
}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-head h1{font-size:28px;line-height:1.15}
.page-head p{margin:4px 0 0;color:var(--muted)}
.demo-banner{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:18px}
.demo-banner b{color:var(--accent-2)}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:14px;min-width:0}.kpi .v{font-size:clamp(15px,5vw,19px)}.kpi .eyebrow{font-size:10px;letter-spacing:.08em}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h2{font-size:17px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
@media (max-width:560px){.kpi .v{font-size:clamp(15px,5.4vw,20px)}}
.up{color:var(--good)} .down{color:var(--bad)}
.two{grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-good{color:var(--good);background:var(--good-soft)} .c-warn{color:var(--warn);background:var(--warn-soft)}
.c-bad{color:var(--bad);background:var(--bad-soft)} .c-info{color:var(--accent-2);background:var(--accent-soft)}
.c-mute{color:var(--muted);background:var(--surface-2)}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.table-wrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.active{background:var(--accent-soft);color:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .input{max-width:320px;flex:1 1 200px}
.client-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.client{cursor:pointer;display:grid;gap:10px;text-align:left}
.client:hover{border-color:var(--accent)}
.client .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.client .who{font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.soon-card{display:grid;gap:8px;border-style:dashed}
.soon-card h3{font-size:16px}
.soon-card p{margin:0;color:var(--muted);font-size:13px}

.pl-track{position:relative;height:10px;border-radius:999px;background:var(--surface-2)}
.pl-track i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.pl-track.late i{background:var(--bad)}
.pl-exp{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--fg)}
.pl-legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:7px}
.s{font-size:12.5px;color:var(--muted)}
.note{margin-top:14px;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.obra-cols{display:grid;gap:18px;margin-top:16px;grid-template-columns:1fr}
@media (min-width:760px){.obra-cols{grid-template-columns:1.2fr 1fr}}
.task{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.task input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent-2);flex:none}
.tick{width:18px;height:18px;flex:none;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.tick.on{background:var(--accent-2);border-color:var(--accent-2);color:var(--bg)}
.miss{padding:8px 0;border-top:1px solid var(--line)}.miss:first-of-type{border-top:0;padding-top:0}
.obra-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.obra-row{text-align:left;width:100%}.obra-row:hover{border-color:var(--accent)}
.who-chip{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.avatar.sm{width:22px;height:22px;font-size:9.5px}
.log{border-left:2px solid var(--line);padding:0 0 12px 14px;position:relative;font-size:13.5px;display:grid;gap:2px}
.log::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent-2)}
textarea.input{min-height:76px;resize:vertical;line-height:1.45}
input[type=range]{accent-color:var(--accent-2)}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.role-pick button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.role-pick button.active{background:var(--accent-soft);color:var(--fg)}

.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:12px;padding:4px}
.type-pick button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.type-pick button.on.in{background:var(--good-soft);color:var(--good)}
.type-pick button.on.out{background:var(--bad-soft);color:var(--bad)}
.lanc-form{display:grid;gap:14px;align-content:start}
.money{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.money:focus-within{border-color:var(--accent-2)}
.money span{font-weight:700;color:var(--muted)}
.money .input{border:0;padding:8px 0;font-size:26px;font-weight:800;background:none}
tfoot td{white-space:nowrap}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px}
.sheet.wide{max-width:860px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:20px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:8px}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.items{display:grid;gap:8px}
.item-row{display:grid;grid-template-columns:1fr 64px 110px 32px;gap:8px;align-items:center}
@media (max-width:520px){.item-row{grid-template-columns:1fr 54px 92px 28px}}
.item-row .input{padding:9px 10px;border-radius:10px;min-width:0}
.total-line{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total-line b{font-size:22px}

/* ---------- PDF paper (sempre papel branco) ---------- */
.paper-wrap{overflow-x:auto;border-radius:10px}
.paper{background:#ffffff;color:#111a26;width:100%;min-width:560px;border-radius:6px;overflow:hidden;font-size:12px;line-height:1.45;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.paper .ph{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(120deg,#06275a,#0a3f8c 60%,#1a62c4);color:#ffffff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 28px}
.paper .ph img{width:220px}
.paper .ph .lines{position:absolute;inset:0;z-index:-1;background-color:#ffffff;opacity:.28}
.paper .ph .doc{position:relative}
.paper .ph .doc{text-align:right;font-size:11px;color:#cfe2fb}
.paper .ph .doc b{display:block;font-family:var(--f-display);font-size:18px;color:#ffffff;letter-spacing:.06em}
.paper .pb{padding:22px 28px;display:grid;gap:18px}
.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.paper .pre{white-space:pre-line}
.paper .pfotos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.paper .pfotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.bar-in i{background:linear-gradient(90deg,var(--good),var(--good))}
.row.click{cursor:pointer} .row.click:hover{background:var(--surface-2)}
.paper .frase{text-align:center;font-weight:700;color:#0a3f8c;font-size:13px;border-top:1px dashed #cfd8e3;padding-top:12px}
.paper .lbl{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#3a7bd5;margin-bottom:4px}
.paper table{font-size:12px}
.paper th{color:#5c6b80;border-bottom:2px solid #3a7bd5;padding:0 8px 6px;font-size:9.5px}
.paper td{border-top:1px solid #e3e8ef;padding:8px;white-space:normal}
.paper .tot{margin-left:auto;width:260px;display:grid;gap:4px}
.paper .tot div{display:flex;justify-content:space-between}
.paper .tot .g{border-top:2px solid #111a26;padding-top:6px;font-weight:800;font-size:15px}
.paper .pf{border-top:1px solid #e3e8ef;padding:14px 28px;display:flex;justify-content:space-between;gap:12px;color:#5c6b80;font-size:10.5px;flex-wrap:wrap}
.sign{margin-top:26px;border-top:1px solid #111a26;width:220px;padding-top:4px;font-size:10.5px;color:#5c6b80}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:80;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
/* ---- app real ---- */
body{margin:0}
.role-pick{grid-template-columns:repeat(3,1fr)}
.auth-msg{margin:0;font-size:13px;text-align:center;color:var(--fg);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.auth-msg.bad{background:var(--bad-soft);color:var(--bad)}
.auth-title{margin:0;font-size:13px;text-align:center;color:var(--muted)}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn,.link{border:0;background:none;padding:0;color:var(--accent-2);font-weight:600;cursor:pointer;font-size:13px}
.linkbtn:hover,.link:hover{text-decoration:underline}
a{color:var(--accent-2)}
.empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty p{margin:0}
.form-err{margin:0;color:var(--bad)!important}
.month-nav{display:flex;align-items:center;gap:10px}
.dot-on{width:10px;height:10px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);flex:none}
.dot-on.hoje{background:var(--accent-2);border-color:transparent;opacity:.6}
.dot-on.on{background:var(--good);border-color:transparent;box-shadow:0 0 0 0 var(--good);animation:pulsaOn 1.8s infinite}
@keyframes pulsaOn{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px;margin-bottom:14px}
.period .p-datas{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.period .p-datas label{display:flex;align-items:center;gap:6px}
.period .p-datas .input{width:auto;padding-top:7px;padding-bottom:7px}
.period .p-atalhos{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.period .p-atalhos button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.period .p-atalhos button.on{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
@media (max-width:560px){.period .p-datas{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.period .p-datas .eyebrow{grid-column:1/-1}.period .p-datas label{flex-direction:column;align-items:stretch;gap:2px;min-width:0}.period .p-datas .input{width:100%;min-width:0}}
.month-nav b{min-width:150px;text-align:center}
.file-btn{cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs:empty{display:none}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
body.busy{cursor:progress}
body.busy::after{content:"";position:fixed;left:0;right:0;top:0;height:3px;z-index:90;background:linear-gradient(90deg,transparent,var(--accent-2),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
#printRoot{display:none}
/* iPhone dá zoom sozinho ao tocar em campo com letra menor que 16px */
@media (pointer:coarse){input.input,select.input,textarea.input{font-size:16px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media print{
  @page{size:A4;margin:10mm}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing::before,body.printing::after{display:none!important}
  body.printing{background:#fff!important}
  body.printing #printRoot{display:block}
  #printRoot .paper{min-width:0;box-shadow:none;border-radius:0}
  #printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.mapa{display:grid;gap:8px;margin:14px 0 4px}
.mapa iframe{width:100%;height:200px;border:1px solid var(--line);border-radius:12px;display:block;background:var(--surface-2)}
.mapa-btns{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}
/* ---- lembretes e avisos ---- */
.nbadge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.lem{align-items:flex-start}
.lem-ck{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent-2);flex:none}
.lem.done .t{text-decoration:line-through;color:var(--muted)}
.lem-form{display:grid;gap:12px}
.note-warn{border-color:var(--warn);background:var(--warn-soft);margin-bottom:14px}
.sheet{grid-template-columns:minmax(0,1fr)}
.w-sec{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.w-obra{display:grid;gap:8px;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.w-obra.bad{border-color:var(--bad)}
.w-sec .t,.lem .t{white-space:normal;overflow:visible}
.w-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dicas{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.alerta,.boa,.ok-msg{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
.alerta>span,.boa>span,.ok-msg>span{font-size:22px;line-height:1}
.alerta{background:var(--bad-soft);border:1px solid var(--bad);color:var(--fg);animation:alerta 1.6s ease-in-out infinite}
.alerta b{color:var(--bad);text-transform:uppercase;letter-spacing:.04em}
.boa{background:var(--good-soft);border:1px solid var(--good)}
.boa b{color:var(--good)}
.ok-msg{background:var(--accent-soft);border:1px solid var(--line)}
.sirene{display:inline-block;animation:sirene .8s ease-in-out infinite}
.obra .alerta,.obra .boa{margin-bottom:12px}
@keyframes alerta{0%,100%{box-shadow:0 0 0 0 rgba(239,95,95,0)}50%{box-shadow:0 0 0 4px rgba(239,95,95,.25)}}
@keyframes sirene{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}
@media (prefers-reduced-motion: reduce){.alerta,.sirene{animation:none}}
/* ---- pedidos de material ---- */
.msg-esc{margin-top:6px;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.miss.ok{color:var(--good);font-size:13.5px}
.miss.ok b{color:var(--fg)}
.reply{color:var(--accent-2)!important;white-space:normal!important}
.fbtns{display:flex;gap:6px;flex-wrap:wrap}
.row:has(.fbtns){flex-wrap:wrap}
.row:has(.fbtns) .grow{flex:1 1 60%}
.row .s,.row .t{overflow-wrap:anywhere}
@media (max-width:560px){.row .fbtns{flex-basis:100%}}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .btn{white-space:normal;text-align:left}
.novid{border-color:var(--accent-2);margin-bottom:16px}
.novid .t{white-space:normal}
/* ---- tela de carregamento: chave de boca apertando o cano ---- */
#splash{position:fixed;inset:0;z-index:200;isolation:isolate;overflow:hidden;display:grid;place-items:center;background:var(--bg);transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sp{display:grid;justify-items:center;gap:14px;padding:16px}
#splash svg{width:min(240px,62vw);height:auto;overflow:visible}
#splash .sp img{width:56px;height:auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
#splash .pipe{fill:var(--surface-2);stroke:var(--accent-2);stroke-width:2.5}
#splash .ring{fill:none;stroke:var(--accent-2);stroke-width:2.5}
#splash .nut{fill:var(--surface);stroke:var(--accent-2);stroke-width:2.5;transform-box:view-box;transform-origin:120px 80px;animation:sp-nut 1.1s ease-in-out infinite}
#splash .wrench{fill:url(#spGrad);transform-box:view-box;transform-origin:120px 80px;animation:sp-wrench 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#splash .drop{fill:var(--accent-2);animation:sp-drop 1.1s ease-in infinite}
@keyframes sp-wrench{0%{transform:rotate(-30deg)}45%,55%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@keyframes sp-nut{0%{transform:rotate(-30deg)}45%,99.9%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@keyframes sp-drop{0%,40%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
@media (prefers-reduced-motion: reduce){#splash .nut,#splash .wrench,#splash .drop{animation-duration:3s}}

/* novidades da demonstração (novo.js): etapas, estoque, agenda, orçamento → obra */
.et-track{position:relative;display:flex;gap:3px;height:12px}
.et-seg{position:relative;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:6px}
.et-seg i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.et-seg.ok i{background:var(--good)}
.et-seg.cur{box-shadow:0 0 0 1.5px var(--accent-2)}
.et-track.late .et-seg.cur i{background:var(--bad)}
.et-track .pl-exp{top:-5px;bottom:-5px}
.et-list{display:grid;gap:2px}
.et-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.et-row:first-child{border-top:0}
.et-row .grow{flex:1;min-width:0}
.et-row.ok .grow{color:var(--muted)}
.et-row.cur .grow{font-weight:700}
.et-row .tick{font-size:10.5px;color:var(--muted)}
.et-row .tick.on{background:var(--good);border-color:var(--good);color:#fff}
.et-row.cur .tick{border-color:var(--accent-2);color:var(--accent-2)}
.et-row .chip{white-space:nowrap}
.et-resumo{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:2px 0 8px}
.et-resumo b{color:var(--fg)}
.et-resumo b.up{color:var(--good)} .et-resumo b.down{color:var(--bad)}
@media (max-width:560px){.et-ed-row{flex-wrap:wrap}.et-ed-row .etT{flex:1 1 calc(100% - 30px)}.et-ed-row .et-d{margin-left:26px;flex:1}}
.et-ed{display:grid;gap:8px}
.et-ed-row{display:flex;gap:8px;align-items:center}
.et-ed-row .etT{flex:1;min-width:0}
.et-d{display:flex;align-items:center;gap:6px}
.et-d .input{width:70px}
.niv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.niv button{display:grid;justify-items:center;gap:2px;padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);font-weight:700;font-size:13.5px;text-align:center}
.niv button span{font-size:24px;line-height:1}
.niv button small{font-weight:500;color:var(--muted);font-size:11.5px}
.niv button.on[data-n=bom]{border-color:var(--good);background:var(--good-soft)}
.niv button.on[data-n=pouco]{border-color:var(--warn);background:var(--warn-soft)}
.niv button.on[data-n=parado]{border-color:var(--bad);background:var(--bad-soft)}
.et-fim{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.bar-low i{background:var(--bad)}
.alerta-est{border-color:var(--warn)}
.mov{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:800}
.mov.entrada{background:var(--good-soft);color:var(--good)} .mov.saida{background:var(--accent-soft);color:var(--accent-2)}
.nbadge.info{background:var(--accent)}
.ag-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.ag-grid{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);align-items:start}}
.cal-card{padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal-d{position:relative;min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-d.fora{opacity:.4} .cal-d.dom{background:var(--surface-2)}
.cal-d.hoje .n{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
.cal-d.sel{border-color:var(--accent-2);box-shadow:0 0 0 1.5px var(--accent-2)}
.cal-d .n{font-weight:800;font-size:13px;align-self:flex-start}
.cal-evs{display:grid;gap:2px}
.cal-evs i{font-style:normal;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:1px 5px;background:var(--accent-soft)}
.cal-evs i.orc{background:var(--warn-soft)} .cal-evs i.manut,.cal-evs i.entrega{background:var(--good-soft)} .cal-evs i.reuniao{background:var(--surface-2)}
.cal-evs i.mais{background:none;color:var(--muted)}
.cal-ob{font-size:10.5px;color:var(--muted);margin-top:auto}
.cal-dots{display:none;gap:3px;flex-wrap:wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
.dot.orc{background:var(--warn)} .dot.manut,.dot.entrega{background:var(--good)} .dot.reuniao{background:var(--muted)} .dot.obra{background:transparent;border:1.5px solid var(--muted)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){.cal-d{min-height:52px;padding:4px;align-items:center}.cal-d .n{align-self:center;font-size:12.5px}.cal-evs,.cal-ob{display:none}.cal-dots{display:flex;justify-content:center}}
.ev-ic{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft)}
.ev-ic.orc{background:var(--warn-soft)} .ev-ic.manut,.ev-ic.entrega{background:var(--good-soft)} .ev-ic.reuniao,.ev-ic.obra{background:var(--surface-2)}
.row.feito .t{text-decoration:line-through;color:var(--muted)}
.dot.confra{background:#c084fc} .cal-evs i.confra{background:rgba(192,132,252,.18)} .ev-ic.confra{background:rgba(192,132,252,.18)}
.os-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}.os-fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.os-assin{background:#fff;border-radius:8px;max-width:280px;width:100%;display:block}
.assin-box{position:relative;border:1px dashed var(--line-2,var(--line));border-radius:12px;overflow:hidden;background:#fff}
.assin-box canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
.assin-hint{position:absolute;inset:auto 0 10px 0;text-align:center;color:#8a97a8;font-size:13px;pointer-events:none}
.os-tot{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;font-size:13px;color:var(--muted)}.os-tot b{color:var(--fg);font-size:16px}
.tool-add.os-add{grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,1fr) auto}.os-add #ffN{grid-column:1/-1}
@media (max-width:640px){.tool-add.os-add{grid-template-columns:1fr 1fr}.os-add #ffI{grid-column:1/-1}}
.ag-aviso{border:1px solid var(--accent-2);border-radius:12px;padding:12px;background:var(--accent-soft)}
.ag-aviso.festa{border-color:#c084fc;background:rgba(192,132,252,.12)}
.tool-add{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
@media (max-width:640px){.tool-add{grid-template-columns:1fr 1fr}.tool-add #tN{grid-column:1/-1}.row.tool{flex-wrap:wrap}.row.tool .grow{flex-basis:100%}.row.tool .t{white-space:normal}.row.tool select{flex:1}}
.row.tool .input{padding-top:6px;padding-bottom:6px;font-size:13px}
.pdf-render{position:fixed;left:-10000px;top:0;width:794px}
.pdf-render .paper{min-width:0;box-shadow:none;border-radius:0}
.pdf-render .paper .ph .lines{display:none}
.btn.pulse{animation:pulsaBtn 1.6s ease-in-out 3}
@keyframes pulsaBtn{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
</style>

        <path d="M109.7 51.8 L110 62.7 L130 62.7 L130.3 51.8 A30 30 0 1 1 109.7 51.8 Z"/>

    <img src="assets/gota.png" alt="">
